<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vision AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -20%,#18263d,#080b12 45%,#020306);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    text-align:center;
    padding:22px 15px 12px;
}

.logo{
    font-size:31px;
    font-weight:800;
    letter-spacing:2px;
}

.subtitle{
    color:#77849a;
    margin-top:6px;
}

.container{
    width:94%;
    max-width:900px;
    margin:auto;
}

/* STATUS */

.status{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 16px;
    border-radius:16px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    margin-bottom:14px;
}

.statusLeft{
    display:flex;
    align-items:center;
    gap:9px;
}

.statusDot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ff4040;
    box-shadow:0 0 12px #ff4040;
}

.statusDot.active{
    background:#00ff9d;
    box-shadow:0 0 15px #00ff9d;
}

/* CAMERA */

.camera{
    position:relative;
    overflow:hidden;
    border-radius:24px;
    background:#000;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 60px rgba(0,0,0,.55);
}

video{
    display:block;
    width:100%;
    background:#000;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* SCAN */

.scan{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:2px;
    background:#00ff9d;
    box-shadow:0 0 18px #00ff9d;
    opacity:0;
}

.scanning .scan{
    opacity:.7;
    animation:scan 2.5s linear infinite;
}

@keyframes scan{

    0%{
        top:0;
    }

    50%{
        top:100%;
    }

    100%{
        top:0;
    }

}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
}

button{
    border:0;
    border-radius:13px;
    padding:14px 10px;
    color:white;
    background:#151c2a;
    border:1px solid rgba(255,255,255,.08);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.start{
    background:#00a96f;
}

.stop{
    background:#a72d39;
}

.voiceOn{
    background:#245347;
}

.voiceOff{
    background:#40242a;
}

/* RESULT */

.result{
    margin-top:14px;
    padding:19px;
    border-radius:18px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
}

.smallTitle{
    color:#758198;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}

#result{
    margin-top:8px;
    font-size:24px;
    font-weight:bold;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:10px;
}

.stat{
    padding:14px;
    border-radius:15px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
}

.statLabel{
    color:#68758b;
    font-size:11px;
}

.statValue{
    margin-top:5px;
    font-size:21px;
    font-weight:bold;
}

/* OBJECTS */

.panel{
    margin-top:10px;
    padding:17px;
    border-radius:18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
}

.panelTitle{
    font-size:16px;
    font-weight:bold;
    margin-bottom:12px;
}

.object{
    margin:11px 0;
}

.objectTop{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
}

.bar{
    height:7px;
    background:#151b27;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#00d98b;
    border-radius:20px;
}

/* SETTINGS */

.setting{
    margin-top:16px;
}

.settingLabel{
    display:flex;
    justify-content:space-between;
    color:#aeb8c9;
    margin-bottom:8px;
}

input[type="range"]{
    width:100%;
    accent-color:#00d98b;
}

select{
    width:100%;
    padding:11px;
    border-radius:10px;
    background:#101620;
    color:white;
    border:1px solid #293345;
}

.footer{
    text-align:center;
    color:#4d596c;
    font-size:11px;
    padding:25px;
}

@media(max-width:600px){

    .logo{
        font-size:26px;
    }

    #result{
        font-size:20px;
    }

    button{
        padding:15px 7px;
    }

}

</style>
</head>


<body>

<header>

<div class="logo">
🤖 VISION AI
</div>

<div class="subtitle">
Real-time mobile object intelligence
</div>

</header>


<div class="container">


<!-- STATUS -->

<div class="status">

<div class="statusLeft">

<div
id="statusDot"
class="statusDot">
</div>

<span id="status">
Loading AI...
</span>

</div>

<span id="fps">
0 FPS
</span>

</div>


<!-- CAMERA -->

<div
id="cameraBox"
class="camera">

<video
id="camera"
autoplay
playsinline>
</video>

<canvas
id="canvas">
</canvas>

<div class="scan"></div>

</div>


<!-- CONTROLS -->

<div class="controls">

<button
class="start"
onclick="startCamera()">

📷 START AI

</button>


<button
class="stop"
onclick="stopCamera()">

⛔ STOP

</button>


<button
id="voiceButton"
class="voiceOn"
onclick="toggleVoice()">

🔊 VOICE ON

</button>


<button
onclick="switchCamera()">

🔄 SWITCH CAMERA

</button>

</div>


<!-- RESULT -->

<div class="result">

<div class="smallTitle">
Main Detection
</div>

<div id="result">
AI is loading...
</div>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="statLabel">
OBJECTS
</div>

<div
id="objectCount"
class="statValue">
0
</div>

</div>


<div class="stat">

<div class="statLabel">
CONFIDENCE
</div>

<div
id="confidence"
class="statValue">
0%
</div>

</div>


<div class="stat">

<div class="statLabel">
FPS
</div>

<div
id="fpsBig"
class="statValue">
0
</div>

</div>

</div>


<!-- OBJECT PANEL -->

<div class="panel">

<div class="panelTitle">
🔎 What I See
</div>

<div id="objects">
Waiting for camera...
</div>

</div>


<!-- SETTINGS -->

<div class="panel">

<div class="panelTitle">
⚙️ AI SETTINGS
</div>


<div class="setting">

<div class="settingLabel">

<span>
Detection confidence
</span>

<span id="confidenceValue">
50%
</span>

</div>

<input
id="confidenceSlider"
type="range"
min="30"
max="90"
value="50"
step="5"
oninput="updateConfidence()">

</div>


<div class="setting">

<div class="settingLabel">

<span>
AI Voice
</span>

</div>

<select id="voiceSelect">
<option>Loading voices...</option>
</select>

</div>


<div class="setting">

<div class="settingLabel">

<span>
Voice speed
</span>

<span id="speedValue">
1.0
</span>

</div>

<input
id="speedSlider"
type="range"
min="0.6"
max="1.4"
value="1"
step="0.1"
oninput="updateSpeed()">

</div>

</div>


<div class="footer">
VISION AI • TensorFlow.js • COCO-SSD
</div>


</div>


<script>

/* ==================================================
VARIABLES
================================================== */

let model = null;

let cameraRunning = false;

let currentStream = null;

let frontCamera = false;

let voiceEnabled = true;

let voiceUnlocked = false;

let confidenceThreshold = 0.50;

let voiceSpeed = 1;

let detectionBusy = false;

let lastSpoken = new Map();

let fpsCounter = 0;

let fps = 0;

let fpsTime = Date.now();


/* ==================================================
ELEMENTS
================================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const statusDot =
document.getElementById("statusDot");

const result =
document.getElementById("result");

const objects =
document.getElementById("objects");

const objectCount =
document.getElementById("objectCount");

const confidence =
document.getElementById("confidence");

const fpsText =
document.getElementById("fps");

const fpsBig =
document.getElementById("fpsBig");

const cameraBox =
document.getElementById("cameraBox");

const voiceButton =
document.getElementById("voiceButton");

const voiceSelect =
document.getElementById("voiceSelect");


/* ==================================================
VOICE LOADING
================================================== */

function loadVoices(){

    if(!("speechSynthesis" in window)){
        voiceSelect.innerHTML =
        "<option>Voice unavailable</option>";
        return;
    }

    const voices =
    speechSynthesis.getVoices();

    if(!voices.length){
        return;
    }

    voiceSelect.innerHTML = "";

    voices.forEach((voice,index)=>{

        const option =
        document.createElement("option");

        option.value = index;

        option.textContent =
        voice.name + " — " + voice.lang;

        voiceSelect.appendChild(option);

    });

}

speechSynthesis.onvoiceschanged =
loadVoices;

loadVoices();


/* ==================================================
IMPORTANT MOBILE VOICE UNLOCK
================================================== */

function unlockVoice(){

    if(!("speechSynthesis" in window)){
        return false;
    }

    try{

        speechSynthesis.cancel();

        const test =
        new SpeechSynthesisUtterance("");

        test.volume = 0;

        speechSynthesis.speak(test);

        voiceUnlocked = true;

        return true;

    }
    catch(error){

        console.log(
            "Voice unlock failed",
            error
        );

        return false;

    }

}


/* ==================================================
SPEAK
================================================== */

function speak(text){

    if(!voiceEnabled){
        return;
    }

    if(!("speechSynthesis" in window)){
        return;
    }

    try{

        speechSynthesis.cancel();

        const voices =
        speechSynthesis.getVoices();

        const utterance =
        new SpeechSynthesisUtterance(text);

        const selectedIndex =
        parseInt(voiceSelect.value);

        if(
            voices[selectedIndex]
        ){

            utterance.voice =
            voices[selectedIndex];

        }

        utterance.rate =
        voiceSpeed;

        utterance.pitch =
        1;

        utterance.volume =
        1;

        speechSynthesis.speak(
            utterance
        );

    }
    catch(error){

        console.log(
            "Speech error:",
            error
        );

    }

}


/* ==================================================
VOICE TOGGLE
================================================== */

function toggleVoice(){

    voiceEnabled =
    !voiceEnabled;

    if(voiceEnabled){

        voiceButton.innerText =
        "🔊 VOICE ON";

        voiceButton.className =
        "voiceOn";

        unlockVoice();

        speak(
            "Voice activated"
        );

    }
    else{

        voiceButton.innerText =
        "🔇 VOICE OFF";

        voiceButton.className =
        "voiceOff";

        if(
            "speechSynthesis"
            in window
        ){

            speechSynthesis.cancel();

        }

    }

}


/* ==================================================
AI LOADING
================================================== */

async function loadAI(){

    try{

        status.innerText =
        "⚡ Starting AI engine...";

        result.innerText =
        "Initializing TensorFlow...";


        if(
            typeof tf === "undefined"
        ){

            throw new Error(
                "TensorFlow failed to load"
            );

        }


        /* Wait for TensorFlow */

        await tf.ready();


        status.innerText =
        "🧠 Downloading AI model...";

        result.innerText =
        "Downloading object detector...";


        /* Load smaller mobile model */

        model =
        await cocoSsd.load({
            base:"lite_mobilenet_v2"
        });


        status.innerText =
        "✅ AI READY";

        result.innerText =
        "📷 Press START AI";

        console.log(
            "VISION AI READY"
        );

    }
    catch(error){

        console.error(
            "AI LOAD ERROR:",
            error
        );

        status.innerText =
        "❌ AI FAILED";

        result.innerText =
        "AI could not load";

        objects.innerHTML =
        `
        <b>Loading error</b><br>
        ${error.message}
        `;

    }

}


/* ==================================================
START CAMERA
================================================== */

async function startCamera(){

    /* 🔊 IMPORTANT:
       This function is called directly
       from a button click.
       That makes mobile browsers much
       more likely to allow speech.
    */

    if(voiceEnabled){

        unlockVoice();

        speak(
            "Vision AI activated"
        );

    }


    if(!model){

        result.innerText =
        "⏳ AI is still loading...";

        return;

    }


    try{

        if(currentStream){

            currentStream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

        }


        const constraints = {

            video:{

                facingMode:
                frontCamera
                ? "user"
                : "environment",

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        };


        currentStream =
        await navigator
        .mediaDevices
        .getUserMedia(
            constraints
        );


        video.srcObject =
        currentStream;


        cameraRunning =
        true;


        status.innerText =
        "🟢 CAMERA ACTIVE";

        statusDot.classList.add(
            "active"
        );

        cameraBox.classList.add(
            "scanning"
        );


        result.innerText =
        "🔍 Scanning...";


        detectObjects();

    }
    catch(error){

        console.error(error);

        status.innerText =
        "❌ CAMERA ERROR";

        result.innerText =
        error.message;

    }

}


/* ==================================================
SWITCH CAMERA
================================================== */

async function switchCamera(){

    frontCamera =
    !frontCamera;

    if(cameraRunning){

        stopCamera();

        await startCamera();

    }

}


/* ==================================================
STOP
================================================== */

function stopCamera(){

    cameraRunning =
    false;

    detectionBusy =
    false;

    cameraBox.classList.remove(
        "scanning"
    );


    if(currentStream){

        currentStream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        currentStream =
        null;

    }


    video.srcObject =
    null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(
        "speechSynthesis"
        in window
    ){

        speechSynthesis.cancel();

    }


    status.innerText =
    "⛔ CAMERA STOPPED";

    statusDot.classList.remove(
        "active"
    );

    result.innerText =
    "📷 Press START AI";

    objects.innerText =
    "No objects detected";

    objectCount.innerText =
    "0";

    confidence.innerText =
    "0%";

}


/* ==================================================
OBJECT VOICE
================================================== */

function speakObject(
    name,
    percent
){

    if(!voiceEnabled){
        return;
    }


    const now =
    Date.now();

    const previous =
    lastSpoken.get(name) || 0;


    /* Don't repeat same object
       for 5 seconds */

    if(
        now - previous < 5000
    ){

        return;

    }


    lastSpoken.set(
        name,
        now
    );


    let text;


    switch(name){

        case "person":

            text =
            "I can see a person.";

            break;


        case "cell phone":

            text =
            "I can see a mobile phone.";

            break;


        case "laptop":

            text =
            "I can see a laptop.";

            break;


        case "bottle":

            text =
            "I can see a bottle.";

            break;


        case "chair":

            text =
            "I can see a chair.";

            break;


        case "car":

            text =
            "I can see a car.";

            break;


        case "dog":

            text =
            "I can see a dog.";

            break;


        case "cat":

            text =
            "I can see a cat.";

            break;


        case "backpack":

            text =
            "I can see a backpack.";

            break;


        default:

            text =
            "I can see a " +
            name + ".";

    }


    speak(
        text +
        " Confidence " +
        percent +
        " percent."
    );

}


/* ==================================================
DETECTION LOOP
================================================== */

async function detectObjects(){

    if(
        !cameraRunning ||
        !model
    ){

        return;

    }


    if(detectionBusy){

        setTimeout(
            detectObjects,
            250
        );

        return;

    }


    if(
        video.readyState <
        video.HAVE_ENOUGH_DATA
    ){

        setTimeout(
            detectObjects,
            250
        );

        return;

    }


    detectionBusy =
    true;


    try{

        canvas.width =
        video.videoWidth;

        canvas.height =
        video.videoHeight;


        const predictions =
        await model.detect(
            video
        );


        const filtered =
        predictions
        .filter(
            item =>
            item.score >=
            confidenceThreshold
        )
        .sort(
            (a,b)=>
            b.score-a.score
        );


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* FPS */

        fpsCounter++;

        const now =
        Date.now();

        if(
            now-fpsTime >= 1000
        ){

            fps =
            fpsCounter;

            fpsCounter =
            0;

            fpsTime =
            now;

            fpsText.innerText =
            fps + " FPS";

            fpsBig.innerText =
            fps;

        }


        /* NOTHING */

        if(
            filtered.length === 0
        ){

            result.innerText =
            "👀 Nothing confidently detected";

            objectCount.innerText =
            "0";

            confidence.innerText =
            "0%";

            objects.innerText =
            "No confident objects";

        }


        /* OBJECTS */

        else{

            const best =
            filtered[0];

            const percent =
            Math.round(
                best.score*100
            );


            result.innerText =
            "🎯 " +
            best.class.toUpperCase() +
            " • " +
            percent +
            "%";


            objectCount.innerText =
            filtered.length;

            confidence.innerText =
            percent + "%";


            speakObject(
                best.class,
                percent
            );


            objects.innerHTML =
            filtered
            .map(item=>{

                const p =
                Math.round(
                    item.score*100
                );

                return `

                <div class="object">

                    <div class="objectTop">

                        <span>
                            ${item.class}
                        </span>

                        <span>
                            ${p}%
                        </span>

                    </div>

                    <div class="bar">

                        <div
                        class="fill"
                        style="width:${p}%">
                        </div>

                    </div>

                </div>

                `;

            })
            .join("");


            drawBoxes(
                filtered
            );

        }

    }
    catch(error){

        console.error(
            "Detection error:",
            error
        );

    }


    detectionBusy =
    false;


    if(cameraRunning){

        setTimeout(
            detectObjects,
            180
        );

    }

}


/* ==================================================
DRAW BOXES
================================================== */

function drawBoxes(
    predictions
){

    ctx.lineWidth =
    4;

    ctx.font =
    "bold 17px Arial";


    predictions.forEach(
        item=>{

            const [
                x,
                y,
                width,
                height
            ] =
            item.bbox;


            const percent =
            Math.round(
                item.score*100
            );


            const label =
            item.class +
            " " +
            percent +
            "%";


            /* Box */

            ctx.strokeStyle =
            "#00ff9d";

            ctx.strokeRect(
                x,
                y,
                width,
                height
            );


            /* Label */

            const textWidth =
            ctx.measureText(
                label
            ).width;


            const labelY =
            Math.max(
                30,
                y
            );


            ctx.fillStyle =
            "#00ff9d";


            ctx.fillRect(
                x,
                labelY-30,
                textWidth+16,
                30
            );


            ctx.fillStyle =
            "#00150d";


            ctx.fillText(
                label,
                x+8,
                labelY-9
            );

        }
    );

}


/* ==================================================
SETTINGS
================================================== */

function updateConfidence(){

    const value =
    document.getElementById(
        "confidenceSlider"
    ).value;


    confidenceThreshold =
    value/100;


    document.getElementById(
        "confidenceValue"
    ).innerText =
    value + "%";

}


function updateSpeed(){

    voiceSpeed =
    parseFloat(
        document.getElementById(
            "speedSlider"
        ).value
    );


    document.getElementById(
        "speedValue"
    ).innerText =
    voiceSpeed.toFixed(1);

}


/* ==================================================
START AI LOADING
================================================== */

loadAI();

</script>

</body>

</html>
