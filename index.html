<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Camera AI</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <!-- COCO-SSD Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

</head>


<body>

    <h1>🤖 Camera AI</h1>

    <div id="status">
        🧠 Loading AI model...
    </div>


    <button onclick="startCamera()">
        📷 Start Camera
    </button>

    <button onclick="stopCamera()">
        ⛔ Stop
    </button>


    <div class="cameraBox">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

    </div>


    <div id="result">
        Waiting for camera...
    </div>

    <div id="objects"></div>


<script>

    let model = null;

    let cameraRunning = false;

    const video =
        document.getElementById("camera");

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const objects =
        document.getElementById("objects");


    // =====================================
    // LOAD AI
    // =====================================

    async function loadAI() {

        try {

            status.innerText =
                "🧠 Loading AI...";

            model = await cocoSsd.load();

            status.innerText =
                "✅ AI ready!";

            result.innerText =
                "📷 Press Start Camera";

        }

        catch (error) {

            console.error(error);

            status.innerText =
                "❌ AI failed to load";

            result.innerText =
                error.message;

        }

    }


    // =====================================
    // START CAMERA
    // =====================================

    async function startCamera() {

        if (!model) {

            result.innerText =
                "⏳ AI is still loading...";

            return;

        }


        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false

                });


            video.srcObject = stream;

            cameraRunning = true;

            status.innerText =
                "📷 Camera active";

            result.innerText =
                "🔎 Looking for objects...";

            detectObjects();

        }

        catch (error) {

            console.error(error);

            status.innerText =
                "❌ Camera error: " + error.name;

        }

    }


    // =====================================
    // STOP CAMERA
    // =====================================

    function stopCamera() {

        cameraRunning = false;


        if (video.srcObject) {

            const tracks =
                video.srcObject.getTracks();

            tracks.forEach(track => {
                track.stop();
            });

            video.srcObject = null;

        }


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        status.innerText =
            "⛔ Camera stopped";

        result.innerText =
            "Press Start Camera";

        objects.innerText = "";

    }


    // =====================================
    // OBJECT DETECTION
    // =====================================

    async function detectObjects() {

        if (!cameraRunning) {
            return;
        }


        if (
            video.readyState !==
            video.HAVE_ENOUGH_DATA
        ) {

            setTimeout(
                detectObjects,
                300
            );

            return;

        }


        // Match canvas to video
        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        try {

            const predictions =
                await model.detect(video);


            // Clear previous boxes
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Only show reasonably confident detections
            const filtered =
                predictions.filter(
                    prediction =>
                        prediction.score >= 0.50
                );


            if (filtered.length === 0) {

                result.innerText =
                    "👀 No object detected";

                objects.innerText = "";

            }

            else {

                // Strongest detection first
                filtered.sort(
                    (a, b) =>
                        b.score - a.score
                );


                const best =
                    filtered[0];


                const confidence =
                    Math.round(
                        best.score * 100
                    );


                result.innerText =
                    `🎯 I see a ${best.class}! ` +
                    `${confidence}% confidence`;


                // List all detected objects

                objects.innerHTML =
                    "<strong>Objects:</strong><br>" +

                    filtered.map(
                        item => {

                            const percent =
                                Math.round(
                                    item.score * 100
                                );

                            return (
                                `• ${item.class} — ` +
                                `${percent}%`
                            );

                        }
                    ).join("<br>");


                // Draw boxes

                drawBoxes(filtered);

            }

        }

        catch (error) {

            console.error(error);

            result.innerText =
                "❌ Detection error";

        }


        // Run again
        setTimeout(
            detectObjects,
            300
        );

    }


    // =====================================
    // DRAW BOUNDING BOXES
    // =====================================

    function drawBoxes(predictions) {

        ctx.lineWidth = 4;

        ctx.font =
            "bold 18px Arial";


        predictions.forEach(
            prediction => {

                const [
                    x,
                    y,
                    width,
                    height
                ] = prediction.bbox;


                // Box
                ctx.strokeRect(
                    x,
                    y,
                    width,
                    height
                );


                const confidence =
                    Math.round(
                        prediction.score * 100
                    );


                const label =
                    `${prediction.class} ${confidence}%`;


                // Label background
                const textWidth =
                    ctx.measureText(label).width;


                ctx.fillRect(
                    x,
                    Math.max(
                        0,
                        y - 28
                    ),
                    textWidth + 12,
                    28
                );


                // Label text
                ctx.fillText(
                    label,
                    x + 6,
                    Math.max(
                        20,
                        y - 8
                    )
                );

            }
        );

    }


    // =====================================
    // START LOADING AI
    // =====================================

    loadAI();

</script>

</body>

</html>
