```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera AI</title>

    <!-- AI libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 10px;
            font-size: 32px;
        }

        #status {
            margin: 15px;
            font-size: 18px;
        }

        .cameraBox {
            position: relative;
            width: 95%;
            max-width: 650px;
            margin: auto;
            border-radius: 20px;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100%;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        button {
            margin: 8px 4px;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
        }

        #result {
            margin: 20px auto 10px;
            padding: 15px;
            max-width: 650px;
            background: #222;
            border-radius: 15px;
            font-size: 22px;
        }

        #objects {
            margin: 10px auto;
            max-width: 650px;
            padding: 12px;
            background: #1b1b1b;
            border-radius: 12px;
            font-size: 17px;
            line-height: 1.6;
        }

    </style>

</head>


<body>

    <h1>🤖 Camera AI</h1>

    <div id="status">
        🧠 Loading AI model...
    </div>


    <button onclick="startCamera()">
        📷 Start Camera
    </button>

    <button onclick="stopCamera()">
        ⛔ Stop Camera
    </button>

    <button onclick="toggleVoice()" id="voiceButton">
        🔊 Voice: ON
    </button>


    <div class="cameraBox">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

    </div>


    <div id="result">
        Waiting for camera...
    </div>


    <div id="objects"></div>


<script>

    // ==========================================
    // VARIABLES
    // ==========================================

    let model = null;

    let cameraRunning = false;

    let voiceEnabled = true;

    let lastSpokenObject = "";

    let lastSpokenTime = 0;


    const video =
        document.getElementById("camera");

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const objects =
        document.getElementById("objects");

    const voiceButton =
        document.getElementById("voiceButton");


    // ==========================================
    // LOAD AI MODEL
    // ==========================================

    async function loadAI() {

        try {

            status.innerText =
                "🧠 Loading AI model...";

            model = await cocoSsd.load();

            status.innerText =
                "✅ AI ready!";

            result.innerText =
                "📷 Press Start Camera";

        }

        catch (error) {

            console.error(error);

            status.innerText =
                "❌ AI failed to load";

            result.innerText =
                "Error: " + error.message;

        }

    }


    // ==========================================
    // START CAMERA
    // ==========================================

    async function startCamera() {

        if (!model) {

            result.innerText =
                "⏳ AI is still loading...";

            return;

        }


        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


            video.srcObject = stream;

            cameraRunning = true;


            status.innerText =
                "📷 Camera active";

            result.innerText =
                "🔎 Looking for objects...";


            detectObjects();

        }

        catch (error) {

            console.error(error);

            status.innerText =
                "❌ Camera error: " + error.name;

        }

    }


    // ==========================================
    // STOP CAMERA
    // ==========================================

    function stopCamera() {

        cameraRunning = false;


        if (video.srcObject) {

            const tracks =
                video.srcObject.getTracks();

            tracks.forEach(
                track => track.stop()
            );

            video.srcObject = null;

        }


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        status.innerText =
            "⛔ Camera stopped";

        result.innerText =
            "📷 Press Start Camera";

        objects.innerText = "";

    }


    // ==========================================
    // VOICE ON / OFF
    // ==========================================

    function toggleVoice() {

        voiceEnabled =
            !voiceEnabled;


        if (voiceEnabled) {

            voiceButton.innerText =
                "🔊 Voice: ON";

        }

        else {

            voiceButton.innerText =
                "🔇 Voice: OFF";

            window.speechSynthesis.cancel();

        }

    }


    // ==========================================
    // AI VOICE
    // ==========================================

    function speakDetection(
        objectName,
        confidence
    ) {

        if (!voiceEnabled) {
            return;
        }


        const now =
            Date.now();


        // Don't repeat the same object too quickly
        if (
            objectName === lastSpokenObject &&
            now - lastSpokenTime < 3000
        ) {

            return;

        }


        lastSpokenObject =
            objectName;

        lastSpokenTime =
            now;


        let message;


        // Custom voice responses
        if (objectName === "person") {

            message =
                `I see a person. ` +
                `Confidence ${confidence} percent.`;

        }

        else if (objectName === "bottle") {

            message =
                `I see a bottle. ` +
                `Confidence ${confidence} percent.`;

        }

        else if (objectName === "cell phone") {

            message =
                `I see a phone. ` +
                `Confidence ${confidence} percent.`;

        }

        else if (objectName === "laptop") {

            message =
                `I see a laptop. ` +
                `Confidence ${confidence} percent.`;

        }

        else if (objectName === "chair") {

            message =
                `I see a chair. ` +
                `Confidence ${confidence} percent.`;

        }

        else {

            message =
                `I see a ${objectName}. ` +
                `Confidence ${confidence} percent.`;

        }


        const speech =
            new SpeechSynthesisUtterance(
                message
            );


        speech.rate = 1;

        speech.pitch = 1;

        speech.volume = 1;


        window.speechSynthesis.cancel();

        window.speechSynthesis.speak(
            speech
        );

    }


    // ==========================================
    // OBJECT DETECTION
    // ==========================================

    async function detectObjects() {

        if (!cameraRunning) {
            return;
        }


        if (
            video.readyState !==
            video.HAVE_ENOUGH_DATA
        ) {

            setTimeout(
                detectObjects,
                300
            );

            return;

        }


        // Match canvas to camera
        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        try {

            // Ask AI to detect objects
            const predictions =
                await model.detect(video);


            // Clear old boxes
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Only use detections above 50%
            const filtered =
                predictions.filter(
                    prediction =>
                        prediction.score >= 0.50
                );


            // ==================================
            // NOTHING DETECTED
            // ==================================

            if (filtered.length === 0) {

                result.innerText =
                    "👀 No object detected";

                objects.innerText =
                    "";

            }


            // ==================================
            // OBJECTS DETECTED
            // ==================================

            else {

                // Highest confidence first
                filtered.sort(
                    (a, b) =>
                        b.score - a.score
                );


                const best =
                    filtered[0];


                const confidence =
                    Math.round(
                        best.score * 100
                    );


                // Display main result
                result.innerText =
                    `🎯 I see a ${best.class}! ` +
                    `${confidence}% confidence`;


                // Speak result
                speakDetection(
                    best.class,
                    confidence
                );


                // ==================================
                // LIST ALL OBJECTS
                // ==================================

                objects.innerHTML =
                    "<strong>🔎 Objects detected:</strong><br>" +

                    filtered.map(
                        item => {

                            const percent =
                                Math.round(
                                    item.score * 100
                                );


                            return (
                                `• ${item.class} — ` +
                                `${percent}%`
                            );

                        }
                    ).join("<br>");


                // Draw boxes
                drawBoxes(filtered);

            }

        }

        catch (error) {

            console.error(error);

            result.innerText =
                "❌ Detection error";

        }


        // Run detection again
        setTimeout(
            detectObjects,
            300
        );

    }


    // ==========================================
    // DRAW BOUNDING BOXES
    // ==========================================

    function drawBoxes(predictions) {

        ctx.lineWidth = 4;

        ctx.font =
            "bold 18px Arial";


        predictions.forEach(
            prediction => {

                const [
                    x,
                    y,
                    width,
                    height
                ] = prediction.bbox;


                // Draw rectangle
                ctx.strokeRect(
                    x,
                    y,
                    width,
                    height
                );


                const confidence =
                    Math.round(
                        prediction.score * 100
                    );


                const label =
                    `${prediction.class} ${confidence}%`;


                const textWidth =
                    ctx.measureText(label).width;


                // Label background
                ctx.fillRect(
                    x,
                    Math.max(
                        0,
                        y - 30
                    ),
                    textWidth + 14,
                    30
                );


                // Label text
                ctx.fillText(
                    label,
                    x + 7,
                    Math.max(
                        21,
                        y - 9
                    )
                );

            }
        );

    }


    // ==========================================
    // START AI
    // ==========================================

    loadAI();

</script>

</body>

</html>
