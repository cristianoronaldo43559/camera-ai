<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>VISION AI</title>

<!-- AI -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            #17352d 0%,
            #0a1110 35%,
            #050707 75%
        );

    color:#ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x:hidden;
}


/* =========================
   APP
========================= */

.app{

    width:100%;
    min-height:100vh;

    display:flex;
    flex-direction:column;

}


/* =========================
   TOP BAR
========================= */

.topbar{

    width:100%;

    padding:
        18px
        18px
        12px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    position:relative;

    z-index:10;
}

.brand{

    display:flex;
    align-items:center;
    gap:11px;
}

.logo{

    width:42px;
    height:42px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #16e89a,
            #07855b
        );

    box-shadow:
        0 0 25px rgba(0,255,170,.22);

    font-size:21px;
}

.brandText{

    display:flex;
    flex-direction:column;
    gap:2px;

}

.brandName{

    font-size:17px;
    font-weight:800;
    letter-spacing:1.5px;
}

.brandSub{

    color:#71807b;

    font-size:10px;

    letter-spacing:2px;

    text-transform:uppercase;
}


/* ONLINE */

.online{

    display:flex;
    align-items:center;
    gap:7px;

    padding:
        8px
        11px;

    border-radius:20px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:#8eaaa1;

    font-size:11px;

    letter-spacing:.7px;
}

.onlineDot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#00ff9d;

    box-shadow:
        0 0 10px #00ff9d;

    animation:pulse 1.6s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.35;
    }

}


/* =========================
   CAMERA AREA
========================= */

.cameraWrap{

    width:100%;

    padding:
        4px
        14px
        0;

    flex:1;

    display:flex;
    justify-content:center;
}


.camera{

    position:relative;

    width:100%;
    max-width:760px;

    aspect-ratio:3 / 4;

    background:#000;

    border-radius:28px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.5);

}


/* =========================
   VIDEO
========================= */

video{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

}


/* =========================
   CANVAS
========================= */

canvas{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    pointer-events:none;

}


/* =========================
   CAMERA GRADIENT
========================= */

.camera::after{

    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:35%;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.75)
        );

    pointer-events:none;

}


/* =========================
   SCAN LINE
========================= */

.scanLine{

    position:absolute;

    left:8%;
    right:8%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00ff9d,
            transparent
        );

    box-shadow:
        0 0 14px
        rgba(0,255,157,.7);

    opacity:.55;

    animation:
        scan 3.5s
        ease-in-out
        infinite;

    pointer-events:none;
}

@keyframes scan{

    0%{
        top:10%;
        opacity:0;
    }

    15%{
        opacity:.7;
    }

    85%{
        opacity:.7;
    }

    100%{
        top:90%;
        opacity:0;
    }

}


/* =========================
   CORNER UI
========================= */

.corner{

    position:absolute;

    width:27px;
    height:27px;

    border-color:
        rgba(0,255,157,.85);

    border-style:solid;

    z-index:4;

}

.corner.tl{

    top:18px;
    left:18px;

    border-width:2px 0 0 2px;

}

.corner.tr{

    top:18px;
    right:18px;

    border-width:2px 2px 0 0;

}

.corner.bl{

    bottom:18px;
    left:18px;

    border-width:0 0 2px 2px;

}

.corner.br{

    bottom:18px;
    right:18px;

    border-width:0 2px 2px 0;

}


/* =========================
   CAMERA LABEL
========================= */

.cameraLabel{

    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    padding:
        8px
        13px;

    border-radius:20px;

    background:
        rgba(0,0,0,.48);

    backdrop-filter:
        blur(12px);

    border:
        1px solid
        rgba(255,255,255,.1);

    color:#b9c8c3;

    font-size:10px;

    letter-spacing:1.5px;

    white-space:nowrap;

}


/* =========================
   RESULT CARD
========================= */

.resultCard{

    position:absolute;

    left:18px;
    right:18px;
    bottom:18px;

    z-index:6;

    padding:15px 16px;

    border-radius:18px;

    background:
        rgba(8,13,12,.72);

    backdrop-filter:
        blur(18px);

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.25);

}

.resultTop{

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:7px;

}

.resultTitle{

    color:#6f817b;

    font-size:9px;

    letter-spacing:1.8px;

    text-transform:uppercase;

}

.confidence{

    color:#00ff9d;

    font-size:11px;

    font-weight:bold;
}

.resultObject{

    font-size:24px;

    font-weight:800;

    letter-spacing:.2px;
}

.resultHint{

    margin-top:4px;

    color:#899792;

    font-size:11px;
}


/* =========================
   BOTTOM CONTROLS
========================= */

.controls{

    width:100%;

    padding:
        16px
        18px
        22px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

}


/* =========================
   BUTTONS
========================= */

button{

    border:none;

    color:white;

    font-family:inherit;

    cursor:pointer;

    transition:
        transform .15s,
        background .2s;

    -webkit-tap-highlight-color:
        transparent;

}

button:active{

    transform:scale(.94);

}


/* START */

.startBtn{

    flex:1;

    max-width:240px;

    height:55px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #00d889,
            #009b67
        );

    box-shadow:
        0 8px 30px
        rgba(0,255,157,.18);

    font-size:15px;

    font-weight:800;

    letter-spacing:.5px;
}


/* ROUND BUTTONS */

.iconBtn{

    width:55px;
    height:55px;

    flex-shrink:0;

    border-radius:18px;

    background:
        rgba(255,255,255,.065);

    border:
        1px solid
        rgba(255,255,255,.1);

    backdrop-filter:
        blur(12px);

    font-size:21px;

}


/* STOP */

.stopBtn{

    color:#ff8585;

}


/* =========================
   STATUS
========================= */

.statusArea{

    text-align:center;

    padding-bottom:3px;

    min-height:25px;

}

.status{

    display:inline-flex;

    align-items:center;

    gap:7px;

    color:#71807b;

    font-size:10px;

    letter-spacing:1.2px;

    text-transform:uppercase;

}

.statusDot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#6a7773;

}

.status.ready .statusDot{

    background:#00ff9d;

    box-shadow:
        0 0 9px #00ff9d;

}

.status.error .statusDot{

    background:#ff5c5c;

    box-shadow:
        0 0 9px #ff5c5c;

}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .camera{

        aspect-ratio:16 / 10;

        max-height:
            calc(100vh - 150px);

    }

    .cameraWrap{

        padding:
            8px
            24px
            0;

    }

}


/* =========================
   SMALL PHONES
========================= */

@media(max-height:650px){

    .topbar{

        padding-top:11px;

    }

    .cameraWrap{

        padding-top:0;

    }

    .camera{

        border-radius:22px;

    }

    .controls{

        padding-top:10px;
        padding-bottom:12px;

    }

}


/* =========================
   LOADING OVERLAY
========================= */

.loading{

    position:absolute;

    inset:0;

    z-index:20;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        rgba(3,7,6,.92);

    backdrop-filter:
        blur(12px);

    transition:
        opacity .4s;

}

.loading.hide{

    opacity:0;

    pointer-events:none;

}

.loader{

    width:45px;
    height:45px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.08);

    border-top-color:
        #00ff9d;

    animation:
        spin .8s
        linear
        infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.loadingText{

    margin-top:15px;

    color:#9aa9a4;

    font-size:11px;

    letter-spacing:1.5px;

}


/* =========================
   HIDDEN
========================= */

.hidden{

    display:none;

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================
         HEADER
    ====================== -->

    <header class="topbar">

        <div class="brand">

            <div class="logo">
                ◉
            </div>

            <div class="brandText">

                <div class="brandName">
                    VISION AI
                </div>

                <div class="brandSub">
                    Object Recognition
                </div>

            </div>

        </div>


        <div class="online">

            <span class="onlineDot"></span>

            AI ONLINE

        </div>

    </header>



    <!-- =====================
         CAMERA
    ====================== -->

    <main class="cameraWrap">

        <div class="camera">


            <video
                id="video"
                autoplay
                playsinline>
            </video>


            <canvas
                id="canvas">
            </canvas>


            <!-- Scan -->

            <div class="scanLine"></div>


            <!-- Corners -->

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>


            <!-- Camera label -->

            <div
                class="cameraLabel"
                id="cameraLabel">

                BACK CAMERA

            </div>


            <!-- Result -->

            <div class="resultCard">

                <div class="resultTop">

                    <div class="resultTitle">
                        AI Detection
                    </div>

                    <div
                        class="confidence"
                        id="confidence">
                    </div>

                </div>


                <div
                    class="resultObject"
                    id="result">

                    Waiting...

                </div>


                <div
                    class="resultHint"
                    id="resultHint">

                    Start the camera to begin scanning

                </div>

            </div>


            <!-- Loading -->

            <div
                class="loading"
                id="loading">

                <div class="loader"></div>

                <div
                    class="loadingText"
                    id="loadingText">

                    LOADING AI MODEL

                </div>

            </div>


        </div>

    </main>



    <!-- =====================
         STATUS
    ====================== -->

    <div class="statusArea">

        <div
            class="status"
            id="status">

            <span class="statusDot"></span>

            <span id="statusText">
                Loading AI
            </span>

        </div>

    </div>



    <!-- =====================
         CONTROLS
    ====================== -->

    <div class="controls">


        <button
            class="iconBtn stopBtn"
            onclick="stopAI()"
            aria-label="Stop">

            ■

        </button>


        <button
            class="startBtn"
            onclick="startAI()">

            📷 START SCANNING

        </button>


        <button
            class="iconBtn"
            onclick="switchCamera()"
            aria-label="Switch camera">

            🔄

        </button>


    </div>


</div>



<script>

/* =========================================
   VARIABLES
========================================= */

let model = null;

let stream = null;

let running = false;

let detecting = false;

let cameraMode = "environment";

let lastObject = "";

let lastVoiceTime = 0;


/* =========================================
   ELEMENTS
========================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const result =
    document.getElementById("result");

const confidence =
    document.getElementById("confidence");

const resultHint =
    document.getElementById("resultHint");

const status =
    document.getElementById("status");

const statusText =
    document.getElementById("statusText");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const cameraLabel =
    document.getElementById("cameraLabel");


/* =========================================
   STATUS HELPER
========================================= */

function setStatus(text, type=""){

    statusText.innerText = text;

    status.className =
        "status " + type;

}


/* =========================================
   LOAD AI
========================================= */

async function loadAI(){

    try{

        setStatus(
            "Loading AI"
        );

        loadingText.innerText =
            "LOADING AI MODEL";

        /*
         * IMPORTANT:
         * Using the original COCO-SSD
         * configuration here.
         *
         * Not using the lite model.
         */

        model =
            await cocoSsd.load();


        loading.classList.add(
            "hide"
        );


        setStatus(
            "AI Ready",
            "ready"
        );


        result.innerText =
            "Ready to scan";

        resultHint.innerText =
            "Press START SCANNING";


        console.log(
            "VISION AI READY"
        );

    }

    catch(error){

        console.error(error);


        loadingText.innerText =
            "AI FAILED TO LOAD";


        setStatus(
            "AI Error",
            "error"
        );


        result.innerText =
            "AI unavailable";

        resultHint.innerText =
            "Check your internet connection";


        loading.classList.add(
            "hide"
        );

    }

}


/* =========================================
   START AI
========================================= */

async function startAI(){

    if(!model){

        result.innerText =
            "AI still loading";

        resultHint.innerText =
            "Please wait a moment";

        return;

    }


    try{

        /*
         * Unlock speech on mobile
         * from the button press.
         */

        if(
            "speechSynthesis" in window
        ){

            speechSynthesis.cancel();

            const welcome =
                new SpeechSynthesisUtterance(
                    "Vision AI started"
                );

            speechSynthesis.speak(
                welcome
            );

        }


        /*
         * Stop existing camera
         */

        if(stream){

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        /*
         * Camera
         */

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:cameraMode
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        running = true;


        updateCameraLabel();


        setStatus(
            cameraMode === "environment"
                ? "Back Camera Active"
                : "Front Camera Active",
            "ready"
        );


        result.innerText =
            "Scanning...";

        resultHint.innerText =
            "Point the camera at an object";


        /*
         * Start detection
         */

        detect();

    }

    catch(error){

        console.error(error);


        setStatus(
            "Camera Error",
            "error"
        );


        result.innerText =
            "Camera unavailable";

        resultHint.innerText =
            error.message;

    }

}


/* =========================================
   CAMERA SWITCH
========================================= */

async function switchCamera(){

    /*
     * Change selected camera
     */

    if(
        cameraMode === "environment"
    ){

        cameraMode = "user";

    }
    else{

        cameraMode = "environment";

    }


    updateCameraLabel();


    /*
     * If camera isn't running,
     * just change selection.
     */

    if(!running){

        setStatus(
            cameraMode === "environment"
                ? "Back Camera Selected"
                : "Front Camera Selected"
        );

        return;

    }


    /*
     * Stop old camera
     */

    if(stream){

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    try{

        /*
         * Start selected camera
         */

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        exact:cameraMode
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        setStatus(
            cameraMode === "environment"
                ? "Back Camera Active"
                : "Front Camera Active",
            "ready"
        );


        resultHint.innerText =
            "Camera switched successfully";

    }

    catch(error){

        console.warn(
            "Exact camera switch failed:",
            error
        );


        /*
         * Fallback
         */

        try{

            stream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    video:{
                        facingMode:{
                            ideal:cameraMode
                        }
                    },

                    audio:false

                });


            video.srcObject =
                stream;


            await video.play();


            setStatus(
                cameraMode === "environment"
                    ? "Back Camera Active"
                    : "Front Camera Active",
                "ready"
            );

        }

        catch(secondError){

            console.error(
                secondError
            );


            setStatus(
                "Camera Switch Failed",
                "error"
            );


            resultHint.innerText =
                secondError.message;

        }

    }

}


/* =========================================
   CAMERA LABEL
========================================= */

function updateCameraLabel(){

    cameraLabel.innerText =
        cameraMode === "environment"
            ? "BACK CAMERA"
            : "FRONT CAMERA";

}


/* =========================================
   STOP
========================================= */

function stopAI(){

    running = false;


    if(stream){

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;

    }


    video.srcObject = null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();

    }


    setStatus(
        "Stopped"
    );


    result.innerText =
        "Ready";

    confidence.innerText =
        "";

    resultHint.innerText =
        "Press START SCANNING";

}


/* =========================================
   VOICE
========================================= */

function speakObject(name){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    const now =
        Date.now();


    /*
     * Don't spam the same
     * object every frame.
     */

    if(
        name === lastObject &&
        now - lastVoiceTime < 4000
    ){

        return;

    }


    lastObject =
        name;

    lastVoiceTime =
        now;


    let text;


    if(name === "person"){

        text =
            "I see a person";

    }

    else if(
        name === "cell phone"
    ){

        text =
            "I see a phone";

    }

    else if(
        name === "laptop"
    ){

        text =
            "I see a laptop";

    }

    else{

        text =
            "I see a " +
            name;

    }


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.rate = 1;

    speech.pitch = 1;

    speech.volume = 1;


    speechSynthesis.cancel();

    speechSynthesis.speak(
        speech
    );

}


/* =========================================
   DETECTION
========================================= */

async function detect(){

    if(!running){

        detecting = false;

        return;

    }


    /*
     * Prevent multiple
     * detection calls from
     * stacking.
     */

    if(detecting){

        return;

    }


    if(
        video.readyState <
        video.HAVE_ENOUGH_DATA
    ){

        setTimeout(
            detect,
            200
        );

        return;

    }


    detecting = true;


    /*
     * Match canvas to video
     */

    if(
        video.videoWidth &&
        video.videoHeight
    ){

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;

    }


    try{

        const predictions =
            await model.detect(
                video
            );


        /*
         * Clear previous boxes
         */

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * 50% threshold like
         * the original version.
         */

        const objects =
            predictions.filter(
                p =>
                    p.score >= 0.50
            );


        /*
         * Nothing detected
         */

        if(
            objects.length === 0
        ){

            result.innerText =
                "Looking...";

            confidence.innerText =
                "";

            resultHint.innerText =
                "No clear object detected";

        }

        else{

            /*
             * Highest confidence first
             */

            objects.sort(
                (a,b) =>
                    b.score - a.score
            );


            const best =
                objects[0];


            const percent =
                Math.round(
                    best.score * 100
                );


            result.innerText =
                best.class;


            confidence.innerText =
                percent + "%";


            resultHint.innerText =
                "Object detected";


            /*
             * Voice
             */

            speakObject(
                best.class
            );


            /*
             * Draw all detections
             */

            objects.forEach(
                p => {

                    const [
                        x,
                        y,
                        width,
                        height
                    ] =
                        p.bbox;


                    const percent =
                        Math.round(
                            p.score * 100
                        );


                    /*
                     * Box
                     */

                    ctx.strokeStyle =
                        "#00ff9d";

                    ctx.lineWidth =
                        4;

                    ctx.shadowColor =
                        "#00ff9d";

                    ctx.shadowBlur =
                        8;


                    ctx.strokeRect(
                        x,
                        y,
                        width,
                        height
                    );


                    ctx.shadowBlur =
                        0;


                    /*
                     * Label
                     */

                    const label =
                        p.class +
                        "  " +
                        percent +
                        "%";


                    ctx.font =
                        "bold 16px Arial";


                    const textWidth =
                        ctx.measureText(
                            label
                        ).width;


                    const labelWidth =
                        textWidth + 18;


                    const labelHeight =
                        28;


                    const labelY =
                        Math.max(
                            0,
                            y - labelHeight
                        );


                    /*
                     * Label background
                     */

                    ctx.fillStyle =
                        "rgba(0,255,157,.92)";


                    ctx.beginPath();

                    ctx.roundRect(
                        x,
                        labelY,
                        labelWidth,
                        labelHeight,
                        7
                    );

                    ctx.fill();


                    /*
                     * Label text
                     */

                    ctx.fillStyle =
                        "#03110c";


                    ctx.fillText(
                        label,
                        x + 9,
                        labelY + 19
                    );

                }
            );

        }

    }

    catch(error){

        console.error(
            "Detection error:",
            error
        );

    }


    detecting = false;


    /*
     * Continue scanning
     */

    if(running){

        setTimeout(
            detect,
            220
        );

    }

}


/* =========================================
   START
========================================= */

loadAI();

</script>
