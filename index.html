<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vision AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#172033 0%,#080b12 45%,#030407 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

header{
    padding:22px 20px 10px;
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitle{
    color:#7f8da3;
    margin-top:7px;
}

.container{
    width:95%;
    max-width:900px;
    margin:auto;
}

/* STATUS */

.statusBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    padding:12px 15px;
    border-radius:15px;
    margin:15px 0;
}

.statusLeft{
    display:flex;
    align-items:center;
    gap:9px;
}

.dot{
    width:10px;
    height:10px;
    background:#ff3b3b;
    border-radius:50%;
    box-shadow:0 0 12px #ff3b3b;
}

.dot.active{
    background:#00ff9d;
    box-shadow:0 0 15px #00ff9d;
}

/* CAMERA */

.cameraBox{
    position:relative;
    width:100%;
    background:#000;
    border-radius:24px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

video{
    width:100%;
    display:block;
    background:#000;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* SCANNER */

.scanLine{
    position:absolute;
    left:0;
    width:100%;
    height:2px;
    background:#00ff9d;
    box-shadow:0 0 15px #00ff9d;
    opacity:0;
}

.cameraBox.scanning .scanLine{
    opacity:.7;
    animation:scan 2.5s linear infinite;
}

@keyframes scan{
    0%{top:0}
    50%{top:100%}
    100%{top:0}
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

button{
    border:1px solid rgba(255,255,255,.1);
    background:#151b28;
    color:#fff;
    padding:14px;
    border-radius:13px;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#202a3c;
    transform:translateY(-1px);
}

.start{
    background:#00b878;
}

.start:hover{
    background:#00d88d;
}

.stop{
    background:#b82c38;
}

.stop:hover{
    background:#d93645;
}

.voiceOn{
    background:#294f45;
}

.voiceOff{
    background:#3b2025;
}

/* RESULT */

.mainResult{
    margin-top:15px;
    padding:20px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
}

.resultTitle{
    color:#7f8da3;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
}

#result{
    font-size:25px;
    margin-top:8px;
    font-weight:bold;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.stat{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    padding:15px;
    border-radius:15px;
}

.statName{
    color:#748197;
    font-size:12px;
}

.statValue{
    font-size:21px;
    font-weight:bold;
    margin-top:5px;
}

/* OBJECTS */

.objectsPanel{
    margin-top:12px;
    padding:17px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
}

.panelTitle{
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}

.object{
    margin:10px 0;
}

.objectTop{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
}

.bar{
    width:100%;
    height:7px;
    background:#171d28;
    border-radius:20px;
    overflow:hidden;
}

.barFill{
    height:100%;
    background:#00d98b;
    border-radius:20px;
    transition:.3s;
}

/* SETTINGS */

.settings{
    margin-top:12px;
    padding:17px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
}

.setting{
    margin:15px 0;
}

.setting label{
    display:flex;
    justify-content:space-between;
    color:#aab4c5;
    margin-bottom:8px;
}

select,
input[type="range"]{
    width:100%;
}

select{
    background:#111722;
    color:white;
    border:1px solid #293244;
    padding:11px;
    border-radius:10px;
}

input[type="range"]{
    accent-color:#00d98b;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#4e5a6e;
    padding:25px;
    font-size:12px;
}

@media(max-width:600px){

    .logo{
        font-size:27px;
    }

    #result{
        font-size:21px;
    }

    .stats{
        grid-template-columns:1fr 1fr 1fr;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
🤖 VISION AI
</div>

<div class="subtitle">
Real-time object detection
</div>

</header>


<div class="container">


<!-- STATUS -->

<div class="statusBar">

<div class="statusLeft">

<div id="statusDot" class="dot"></div>

<span id="status">
Loading AI model...
</span>

</div>

<div id="fps">
0 FPS
</div>

</div>


<!-- CAMERA -->

<div id="cameraBox" class="cameraBox">

<video
id="camera"
autoplay
playsinline>
</video>

<canvas id="canvas"></canvas>

<div class="scanLine"></div>

</div>


<!-- CONTROLS -->

<div class="controls">

<button
class="start"
onclick="startCamera()">
📷 START CAMERA
</button>

<button
class="stop"
onclick="stopCamera()">
⛔ STOP
</button>

<button
id="voiceButton"
class="voiceOn"
onclick="toggleVoice()">
🔊 VOICE ON
</button>

<button
onclick="switchCamera()">
🔄 SWITCH CAMERA
</button>

</div>


<!-- RESULT -->

<div class="mainResult">

<div class="resultTitle">
Primary Detection
</div>

<div id="result">
Waiting for camera...
</div>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="statName">
OBJECTS
</div>

<div
id="objectCount"
class="statValue">
0
</div>

</div>


<div class="stat">

<div class="statName">
CONFIDENCE
</div>

<div
id="confidence"
class="statValue">
0%
</div>

</div>


<div class="stat">

<div class="statName">
FPS
</div>

<div
id="fpsBig"
class="statValue">
0
</div>

</div>

</div>


<!-- OBJECT LIST -->

<div class="objectsPanel">

<div class="panelTitle">
🔎 Detected Objects
</div>

<div id="objects">
No objects detected
</div>

</div>


<!-- SETTINGS -->

<div class="settings">

<div class="panelTitle">
⚙️ AI Settings
</div>


<div class="setting">

<label>

<span>Detection Confidence</span>

<span id="confidenceValue">
50%
</span>

</label>

<input
id="confidenceSlider"
type="range"
min="30"
max="90"
value="50"
step="5"
oninput="updateConfidence()">

</div>


<div class="setting">

<label>
<span>Voice</span>
</label>

<select id="voiceSelect">
<option>Loading voices...</option>
</select>

</div>


<div class="setting">

<label>

<span>Voice Speed</span>

<span id="speedValue">
1.0
</span>

</label>

<input
id="speedSlider"
type="range"
min="0.5"
max="1.5"
value="1"
step="0.1"
oninput="updateSpeed()">

</div>

</div>


<div class="footer">
VISION AI • TensorFlow.js • COCO-SSD
</div>

</div>


<script>

/* ==========================================
VARIABLES
========================================== */

let model = null;

let cameraRunning = false;

let currentStream = null;

let usingFrontCamera = false;

let voiceEnabled = true;

let confidenceThreshold = 0.50;

let voiceSpeed = 1;

let lastSpokenObjects = new Map();

let detectionBusy = false;

let frameCounter = 0;

let fps = 0;

let fpsStart = Date.now();


/* ==========================================
ELEMENTS
========================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const statusDot =
document.getElementById("statusDot");

const result =
document.getElementById("result");

const objects =
document.getElementById("objects");

const objectCount =
document.getElementById("objectCount");

const confidence =
document.getElementById("confidence");

const fpsText =
document.getElementById("fps");

const fpsBig =
document.getElementById("fpsBig");

const cameraBox =
document.getElementById("cameraBox");

const voiceButton =
document.getElementById("voiceButton");

const voiceSelect =
document.getElementById("voiceSelect");


/* ==========================================
LOAD AI
========================================== */

async function loadAI(){

try{

status.innerText =
"Loading AI model...";

model =
await cocoSsd.load({
base:"lite_mobilenet_v2"
});

status.innerText =
"AI READY";

result.innerText =
"Press START CAMERA";

}
catch(error){

console.error(error);

status.innerText =
"AI FAILED";

result.innerText =
"Could not load AI model";

}

}


/* ==========================================
VOICE SYSTEM
========================================== */

function loadVoices(){

const voices =
speechSynthesis.getVoices();

voiceSelect.innerHTML = "";

voices.forEach((voice,index)=>{

const option =
document.createElement("option");

option.value = index;

option.textContent =
`${voice.name} — ${voice.lang}`;

voiceSelect.appendChild(option);

});

}

speechSynthesis.onvoiceschanged =
loadVoices;

loadVoices();


function speak(text){

if(!voiceEnabled){
return;
}

if(!("speechSynthesis" in window)){
console.log("Speech synthesis unavailable");
return;
}

speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

const voices =
speechSynthesis.getVoices();

const selected =
voices[voiceSelect.value];

if(selected){
speech.voice = selected;
}

speech.rate =
voiceSpeed;

speech.pitch =
1;

speech.volume =
1;

speechSynthesis.speak(speech);

}


/* ==========================================
CUSTOM VOICE RESPONSE
========================================== */

function speakObject(name,percent){

const now =
Date.now();

const last =
lastSpokenObjects.get(name) || 0;


/* 5 second cooldown */

if(now-last < 5000){
return;
}

lastSpokenObjects.set(name,now);


let message =
"I can see a " + name;


/* Special responses */

if(name === "person"){

message =
"I can see a person";

}

else if(name === "cell phone"){

message =
"I can see a mobile phone";

}

else if(name === "laptop"){

message =
"I can see a laptop";

}

else if(name === "bottle"){

message =
"I can see a bottle";

}

else if(name === "chair"){

message =
"I can see a chair";

}

else if(name === "car"){

message =
"I can see a car";

}


speak(
message +
". Confidence " +
percent +
" percent."
);

}


/* ==========================================
VOICE TOGGLE
========================================== */

function toggleVoice(){

voiceEnabled =
!voiceEnabled;

if(voiceEnabled){

voiceButton.innerText =
"🔊 VOICE ON";

voiceButton.className =
"voiceOn";

speak("Voice activated");

}
else{

voiceButton.innerText =
"🔇 VOICE OFF";

voiceButton.className =
"voiceOff";

speechSynthesis.cancel();

}

}


/* ==========================================
START CAMERA
========================================== */

async function startCamera(){

if(!model){

result.innerText =
"AI is still loading...";

return;

}


/* IMPORTANT:
This click unlocks speech on browsers */

if(voiceEnabled){

speak("Vision AI activated");

}


try{

if(currentStream){

currentStream
.getTracks()
.forEach(track=>track.stop());

}


const constraints = {

video:{

facingMode:
usingFrontCamera
? "user"
: "environment",

width:{
ideal:1280
},

height:{
ideal:720
}

},

audio:false

};


currentStream =
await navigator
.mediaDevices
.getUserMedia(constraints);


video.srcObject =
currentStream;

cameraRunning =
true;

status.innerText =
"CAMERA ACTIVE";

statusDot.classList.add("active");

cameraBox.classList.add("scanning");

result.innerText =
"Scanning environment...";

detectObjects();

}
catch(error){

console.error(error);

status.innerText =
"CAMERA ERROR";

result.innerText =
error.message;

}

}


/* ==========================================
SWITCH CAMERA
========================================== */

async function switchCamera(){

usingFrontCamera =
!usingFrontCamera;

if(cameraRunning){

stopCamera();

await startCamera();

}

}


/* ==========================================
STOP CAMERA
========================================== */

function stopCamera(){

cameraRunning =
false;

detectionBusy =
false;

cameraBox.classList.remove("scanning");

if(currentStream){

currentStream
.getTracks()
.forEach(track=>track.stop());

currentStream =
null;

}

video.srcObject =
null;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

status.innerText =
"CAMERA STOPPED";

statusDot.classList.remove("active");

result.innerText =
"Press START CAMERA";

objects.innerText =
"No objects detected";

objectCount.innerText =
"0";

confidence.innerText =
"0%";

}


/* ==========================================
DETECTION
========================================== */

async function detectObjects(){

if(!cameraRunning ||
!model ||
detectionBusy){

if(cameraRunning){

setTimeout(
detectObjects,
250
);

}

return;

}


if(video.readyState <
video.HAVE_ENOUGH_DATA){

setTimeout(
detectObjects,
200
);

return;

}


detectionBusy =
true;


try{

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


/* AI detection */

const predictions =
await model.detect(video);


/* Confidence filtering */

const filtered =
predictions
.filter(item =>
item.score >= confidenceThreshold
);


/* Sort strongest first */

filtered.sort(
(a,b)=>
b.score-a.score
);


/* Clear old boxes */

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/* FPS */

frameCounter++;

const now =
Date.now();

if(now-fpsStart >= 1000){

fps =
frameCounter;

frameCounter = 0;

fpsStart =
now;

fpsText.innerText =
fps + " FPS";

fpsBig.innerText =
fps;

}


/* Nothing */

if(filtered.length === 0){

result.innerText =
"👀 No confident object detected";

objectCount.innerText =
"0";

confidence.innerText =
"0%";

objects.innerText =
"No objects detected";

}


/* Objects */

else{

const best =
filtered[0];

const bestPercent =
Math.round(
best.score * 100
);


result.innerText =
`🎯 ${best.class.toUpperCase()} • ${bestPercent}%`;

objectCount.innerText =
filtered.length;

confidence.innerText =
bestPercent + "%";


/* Voice */

speakObject(
best.class,
bestPercent
);


/* Object list */

objects.innerHTML =
filtered.map(item=>{

const percent =
Math.round(
item.score*100
);

return `

<div class="object">

<div class="objectTop">

<span>
${item.class}
</span>

<span>
${percent}%
</span>

</div>

<div class="bar">

<div
class="barFill"
style="width:${percent}%">
</div>

</div>

</div>

`;

}).join("");


/* Draw */

drawBoxes(filtered);

}

}
catch(error){

console.error(error);

}

finally{

detectionBusy =
false;

if(cameraRunning){

setTimeout(
detectObjects,
180
);

}

}

}


/* ==========================================
DRAW BOXES
========================================== */

function drawBoxes(predictions){

ctx.lineWidth =
4;

ctx.font =
"bold 17px Arial";

predictions.forEach(item=>{

const [
x,
y,
width,
height
] =
item.bbox;


const percent =
Math.round(
item.score*100
);

const label =
`${item.class} ${percent}%`;


/* Box */

ctx.strokeStyle =
"#00ff9d";

ctx.strokeRect(
x,
y,
width,
height
);


/* Label */

const textWidth =
ctx.measureText(label).width;

const labelY =
Math.max(
30,
y
);

ctx.fillStyle =
"#00ff9d";

ctx.fillRect(
x,
labelY-30,
textWidth+16,
30
);


/* Text */

ctx.fillStyle =
"#00150e";

ctx.fillText(
label,
x+8,
labelY-9
);

});

}


/* ==========================================
SETTINGS
========================================== */

function updateConfidence(){

const value =
document.getElementById(
"confidenceSlider"
).value;

confidenceThreshold =
value/100;

document.getElementById(
"confidenceValue"
).innerText =
value + "%";

}


function updateSpeed(){

voiceSpeed =
parseFloat(
document.getElementById(
"speedSlider"
).value
);

document.getElementById(
"speedValue"
).innerText =
voiceSpeed.toFixed(1);

}


/* ==========================================
START
========================================== */

loadAI();

</script>

</body>

</html>
